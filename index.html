<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto final</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .main-header {
            display: flex;
            align-items: center;
            padding: 10px 20px;
            background-color: #0c093b;
        }
        .logo{
            font-size: 24px;
            font-weight: bold;
            background-color: #0c093b;
            color: #f3eeee;
        }
        nav {
            margin-left: auto;
        }
        nav ul {
            display: flex;
            justify-content: flex-end;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        nav li {
            margin-left: 20px;
            background-color: #0c093b;
        }
        nav a {
            color: #f3eeee;
            text-decoration: none;
        }
        .section {
            height: 300px;
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 24px;
            box-sizing: border-box;
            background-color: #1f1a68;
        }
        .section h1 {
            flex: 1;
            font-size: 2.5rem;
        }
        .dominando {
            font-size: 15px;
            position: relative;
            z-index: 2;
            background-color: #f3eeee;
            border-radius: 8px;
            width: 200px;
            height: 120px;
        }
        .camada- {
            font-size: 15px;
            position: relative;
            z-index: 1;
            background-color: #e0e0e0;
            border-radius: 8px;
            width: 200px;
            height: 100px;
        }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="logo">DevMastery Edu</div>
        <nav>
            <ul>
                <li><a href="#planejamento">Planejamento</a></li>
                <li><a href="#analise">Análise</a></li>
                <li><a href="#design">Design</a></li>
                <li><a href="#implementacao">Implementação</a></li>
                <li><a href="#faq">FAQ</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="section">
            <h1>Fluxo de Desenvolvimento Moderno</h1>
            <div class="article-cards">
                <article class="dominando">
                    <h3>Dominando Z-index</h3>
                    <p>Aprenda o poder do posicionamento e empilhamento de elementos</p>
                </article>
                <article class="camada-">
                    <h3>Camada inferior</h3>
                    <p>Esta camada está na camada mais baixa</p>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
